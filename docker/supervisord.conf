[supervisord]
nodaemon=true
logfile=/dev/null
pidfile=/tmp/supervisord.pid
user=graph

[program:api]
directory=/app
command=/usr/local/bin/gunicorn --bind 0.0.0.0:3000 --workers 1 --threads 4 --timeout 120 API.app:app
autostart=true
autorestart=true
priority=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:trainer]
directory=/app/API
command=/usr/local/bin/python -B MainServer.py
autostart=true
autorestart=true
priority=20
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
